# Production stack for a single VM (AWS EC2 Graviton / linux-arm64).
#
#   docker compose -f infra/compose.prod.yml up -d --build
#
# Only the edge is exposed; Postgres and the API are reachable on the internal
# compose network. Set SITE_ADDRESS in .env to the public hostname.

name: ragnarock

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragnarock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ragnarock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragnarock -d ragnarock"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
      target: runtime
    image: ragnarock-api:prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://ragnarock:${POSTGRES_PASSWORD}@db:5432/ragnarock
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: json
      STORAGE_PATH: /data/uploads
      HF_HOME: /data/hf-cache
      AUTH_DISABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      LLM_PROVIDER: openrouter
      EMBEDDING_PROVIDER: local
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
    volumes:
      - uploads:/data/uploads
      - hf-cache:/data/hf-cache
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  edge:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: ragnarock-edge:prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  hf-cache:
  caddy_data:
  caddy_config:
